name: NeoForge build

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check source and generated data
        run: |
          ./gradlew build runData
          git diff --exit-code -- src/generated/resources
          test -z "$(git status --porcelain --untracked-files=all -- src/generated/resources)"
      - name: Run server GameTests
        run: ./gradlew runGameTestServer
      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: pswg-neoforge-1.21.1
          path: build/libs/pswg-*.jar
          if-no-files-found: error
