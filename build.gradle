import org.jetbrains.gradle.ext.Application
import org.jetbrains.gradle.ext.GradleTask
import org.jetbrains.gradle.ext.Make

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.14'
}

group = 'dev.pswg'
version = mod_version
base.archivesName = 'pswg'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

dependencies {
    compileOnly project(':projects:framework')
    annotationProcessor project(':projects:framework-generator')
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pswg'
        }
        data {
            data()
            gameDirectory = file('run/data')
            programArguments.addAll '--mod', 'pswg', '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--input', file('src/main/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        pswg {
            sourceSet sourceSets.main
        }
    }
}

// IntelliJ Application runs consume ModDevGradle argument files that a Gradle clean removes.
idea.project.settings.runConfigurations.withType(Application).configureEach { application ->
    def run = neoForge.runs.find { it.ideName.get() == application.name }
    if (run != null && application.mainClass == 'net.neoforged.devlaunch.Main') {
        def prepareRun = tasks.named("prepare${run.name.capitalize()}Run")
        if (application.beforeRun.empty) {
            application.beforeRun.create('Build', Make)
        }
        application.beforeRun.create(prepareRun.name, GradleTask) { beforeRun ->
            beforeRun.task = prepareRun.get()
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    def metadata = [mod_version: project.version, minecraft_version: minecraft_version,
                    neo_version: neo_version]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    exclude '**/.cache/**'
}

tasks.named('jar', Jar).configure {
    exclude '**/*.jg3d', 'assets/**/datagen/**'
    exclude 'dev/pswg/gametest/**', 'data/pswg/structure/port_test_empty.nbt'
    from('LICENSE')
}
